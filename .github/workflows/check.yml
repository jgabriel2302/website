name: Website checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript and site contracts
        run: |
          node --check page.js
          node --check js/scroll.js
          node --check js/scene3d.js
          node --test tests/site.test.cjs
